<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Deli Maní</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- CARGANDO -->
<div id="pantalla-cargando" class="loading-screen">
  <div class="spinner"></div>
  <p style="color:#94a3b8;font-size:0.85rem;font-weight:600">Conectando...</p>
</div>

<!-- LOGIN -->
<div id="pantalla-login" style="display:none">
  <div class="login-bg">
    <div class="login-box">
      <div class="login-logo">
        <img src="logo.jpg" alt="Deli Maní" class="login-img">
      </div>
      <div class="login-divider"></div>
      <div id="login-error" class="login-error">Usuario o contraseña incorrectos</div>
      <div class="field-wrap">
        <div class="field-label"><span>👤</span> Usuario</div>
        <input type="text" id="login-usuario" placeholder="Tu usuario" class="field-input" autocomplete="off" autocorrect="off" autocapitalize="off">
      </div>
      <div class="field-wrap">
        <div class="field-label"><span>🔒</span> Contraseña</div>
        <input type="password" id="login-password" placeholder="Tu contraseña" class="field-input">
      </div>
      <button class="login-btn" id="login-btn" onclick="intentarLogin()">
        <span>→</span> Ingresar
      </button>
    </div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="pantalla-app" style="display:none">
  <div class="header">
    <div class="header-left">
        <h1>DELI MANÍ</h1>
        <p>MANÍ CONFITADO DE CALIDAD SUPERIOR</p>
    </div>
    <div class="header-right">
      <span class="header-user" id="header-usuario"></span>
      <button class="btn-logout" onclick="cerrarSesion()">⬅ Salir</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-STOCK"     onclick="cambiarPestana('STOCK')">📦 STOCK</button>
    <button class="tab"        id="tab-ENTRADAS"  onclick="cambiarPestana('ENTRADAS')">📥 ENTRADAS</button>
    <button class="tab"        id="tab-VENTAS"    onclick="cambiarPestana('VENTAS')">💰 VENTAS</button>
    <button class="tab"        id="tab-HISTORIAL" onclick="cambiarPestana('HISTORIAL')">📋 HISTORIAL</button>
    <button class="tab" id="tab-GANANCIAS" onclick="cambiarPestana('GANANCIAS')">💰 GANANCIAS</button>
  </div>

  <div class="main" id="contenido-principal"></div>
</div>

<!-- MODAL AGREGAR PRODUCTO -->
<div class="modal-overlay" id="modal-agregar">
  <div class="modal">
    <h3>➕ Registrar Nuevo Producto</h3>
    <div class="form-group"><label class="form-label">Nombre del producto</label><input type="text" id="ins-nombre" class="form-input"></div>
    <div class="form-group"><label class="form-label">Precio de compra ($)</label><input type="number" id="ins-preciocompra" class="form-input"><div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-gray" style="font-size:0.75rem;padding:4px 10px" onclick="calcularPrecioVenta(10)">+10%</button><button type="button" class="btn btn-gray" style="font-size:0.75rem;padding:4px 10px" onclick="calcularPrecioVenta(20)">+20%</button><button type="button" class="btn btn-gray" style="font-size:0.75rem;padding:4px 10px" onclick="calcularPrecioVenta(30)">+30%</button><button type="button" class="btn btn-gray" style="font-size:0.75rem;padding:4px 10px" onclick="calcularPrecioVenta(50)">+50%</button></div></div><div class="form-group"><label class="form-label">Cantidad disponible</label><input type="number" id="ins-cantidad" class="form-input"></div>
    <div class="form-group"><label class="form-label">Precio de venta ($)</label><input type="number" id="ins-precio" class="form-input"></div>
    <div class="btn-row">
      <button class="btn btn-gray" onclick="cerrarModalAgregar()">Cancelar</button>
      <button class="btn btn-green" onclick="procesarGuardarPieza()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL ELIMINAR -->
<div class="modal-overlay" id="modal-eliminar">
  <div class="modal" style="text-align:center">
    <h3 style="margin-bottom:8px">¿Eliminar producto?</h3>
    <p style="font-size:0.85rem;color:#64748b;margin-bottom:20px" id="eliminar-nombre-texto"></p>
    <div class="btn-row">
      <button class="btn btn-gray" onclick="document.getElementById('modal-eliminar').classList.remove('visible')">Cancelar</button>
      <button class="btn btn-red" onclick="confirmarEliminarPieza()" style="background:#ef4444;color:#fff">Eliminar</button>
    </div>
  </div>
</div>
<!-- MODAL EDITAR PRODUCTO -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <h3>✏️ Editar Producto</h3>
    <input type="hidden" id="edit-key">
    <div class="form-group"><label class="form-label">Nombre</label><input type="text" id="edit-nombre" class="form-input"></div>
    <div class="form-group"><label class="form-label">Precio de compra ($)</label><input type="number" id="edit-preciocompra" class="form-input"></div><div class="form-group"><label class="form-label">Precio de venta ($)</label><input type="number" id="edit-precio" class="form-input"></div>
    <div class="form-group"><label class="form-label">Cantidad</label><input type="number" id="edit-cantidad" class="form-input"></div>
    <div class="btn-row">
      <button class="btn btn-gray" onclick="cerrarModalEditar()">Cancelar</button>
      <button class="btn btn-blue" onclick="procesarEditarPieza()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-logout">
  <div class="modal" style="text-align:center">
    <h3 style="margin-bottom:8px">¿Cerrar sesión?</h3>
    <p style="font-size:0.85rem;color:#64748b;margin-bottom:20px">Se cerrará tu sesión como <span id="logout-nombre" style="font-weight:700;color:#5c3a1e"></span></p>
    <div class="btn-row">
      <button class="btn btn-gray" onclick="document.getElementById('modal-logout').classList.remove('visible')">Cancelar</button>
      <button class="btn btn-red" onclick="confirmarLogout()" style="background:#ef4444;color:#fff">Cerrar sesión</button>
    </div>
  </div>
</div>
<div id="toast"></div>

  <script src="app.js"></script>
<script type="module" src="firebase-db.js"></script>
<script src="jarvis-widget.js"></script>
</body>
</html>
